apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: resilience-app-kv
  namespace: resilience-app
spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "820556e4-8e39-4557-b275-d738badeea53"
    keyvaultName: "core-res-prod-cus-kv"
    tenantId: "60152eaf-98fa-4cc4-8848-8edb1f6d1a2d"

    objects: |
      array:
        - |
          objectName: resilience-test-secret
          objectType: secret
          objectVersion: ""

  secretObjects:
    - secretName: resilience-test-secret
      type: Opaque
      data:
        - objectName: resilience-test-secret
          key: value
