trigger:
  branches:
    include:
      - main
  paths:
    include:
      - application/**
      - kubernetes/**
      - pipelines/**
      - terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - application/**
      - kubernetes/**
      - pipelines/**
      - terraform/**

variables:
  azureServiceConnection: 'sc-azure-resilience-prod'

  aksResourceGroup: 'core-res-prod-cus-hub-rg'
  aksClusterName: 'core-res-prod-cus-aks-app01'

  acrName: 'coreresprodcusacr'
  acrLoginServer: 'coreresprodcusacr.azurecr.io'

  imageRepository: 'resilience-app'
  kubernetesNamespace: 'resilience-app'

  vmImageName: 'ubuntu-latest'

stages:

# ============================================================
# Stage 1 - Validate
# ============================================================

- stage: Validate
  displayName: 'Validate application and Kubernetes manifests'

  jobs:
  - job: Validate
    displayName: 'Validate'

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.12'
      inputs:
        versionSpec: '3.12'

    - script: |
        python --version
        python -m pip --version
      displayName: 'Verify Python'

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r application/requirements.txt
      displayName: 'Install Python dependencies'

    - script: |
        python -m compileall application
      displayName: 'Python compile validation'

    - script: |
        kubectl version --client
      displayName: 'Verify kubectl'

    # --------------------------------------------------------
    # Validate PROD and DR Kustomize overlays
    # --------------------------------------------------------

    - script: |
        set -e

        echo "=========================================="
        echo "Validating PROD Kustomize overlay"
        echo "=========================================="

        kubectl kustomize kubernetes/overlays/prod > rendered-prod.yaml

        grep -q "kind: Deployment" rendered-prod.yaml
        grep -q "kind: Service" rendered-prod.yaml
        grep -q "kind: HorizontalPodAutoscaler" rendered-prod.yaml
        grep -q "kind: ServiceMonitor" rendered-prod.yaml

        echo "PROD Kustomize validation passed."

        echo
        echo "=========================================="
        echo "Validating DR Kustomize overlay"
        echo "=========================================="

        kubectl kustomize kubernetes/overlays/dr > rendered-dr.yaml

        grep -q "kind: Deployment" rendered-dr.yaml
        grep -q "kind: Service" rendered-dr.yaml
        grep -q "kind: HorizontalPodAutoscaler" rendered-dr.yaml
        grep -q "kind: ServiceMonitor" rendered-dr.yaml

        echo "DR Kustomize validation passed."

        echo
        echo "=========================================="
        echo "PROD and DR Kustomize validation passed"
        echo "=========================================="
      displayName: 'Validate PROD and DR Kustomize'

    # --------------------------------------------------------
    # Validate Azure Backup configuration-as-code
    #
    # NOTE:
    # These manifests are intentionally NOT applied to AKS.
    # They are validated as GitOps configuration only.
    # --------------------------------------------------------

    - script: |
        set -e

        echo "=========================================="
        echo "Validating Azure Backup configuration"
        echo "=========================================="

        kubectl kustomize kubernetes/backup/azure-backup > rendered-azure-backup.yaml

        echo
        echo "Rendered Azure Backup configuration:"
        echo "------------------------------------------"

        cat rendered-azure-backup.yaml

        echo
        echo "Checking BackupHook..."

        grep -q "kind: BackupHook" rendered-azure-backup.yaml

        echo
        echo "Checking RestoreHook..."

        grep -q "kind: RestoreHook" rendered-azure-backup.yaml

        echo
        echo "Checking Azure Backup API version..."

        grep -q "clusterbackup.dataprotection.microsoft.com/v1alpha1" rendered-azure-backup.yaml

        echo
        echo "Checking BackupHook name..."

        grep -q "name: resilience-app-backup-hook" rendered-azure-backup.yaml

        echo
        echo "Checking RestoreHook name..."

        grep -q "name: resilience-app-restore-hook" rendered-azure-backup.yaml

        echo
        echo "Checking target namespace..."

        grep -q "namespace: resilience-app" rendered-azure-backup.yaml

        echo
        echo "=========================================="
        echo "Azure Backup configuration validation passed"
        echo "=========================================="

        echo
        echo "NOTE:"
        echo "Azure Backup resources are validated only."
        echo "They are NOT applied to the AKS cluster."
        echo "The Azure Backup Extension remains disabled."
      displayName: 'Validate Azure Backup configuration'

# ============================================================
# Stage 2 - Build, Scan and Push
# ============================================================

- stage: BuildAndScan
  displayName: 'Build, Trivy scan and push multi-architecture image'
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: BuildScanPush
    displayName: 'Build multi-architecture image, scan and push'

    pool:
      vmImage: $(vmImageName)

    steps:

    - checkout: self
      fetchDepth: 1

    - script: |
        docker version
        docker buildx version
      displayName: 'Verify Docker Buildx'

    - script: |
        docker buildx create \
          --name resilience-builder \
          --driver docker-container \
          --use

        docker buildx inspect --bootstrap
      displayName: 'Create Buildx builder'

    - task: AzureCLI@2
      displayName: 'Login to Azure and ACR'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "Azure account:"
          az account show

          echo
          echo "Logging into Azure Container Registry..."

          az acr login \
            --name "$(acrName)"

          echo
          echo "ACR login completed."

    # --------------------------------------------------------
    # Build AMD64 + ARM64 image and push manifest
    # --------------------------------------------------------

    - script: |
        set -e

        IMAGE="$(acrLoginServer)/$(imageRepository):$(Build.BuildId)"

        echo "Building multi-architecture image:"
        echo "$IMAGE"

        echo
        echo "Target platforms:"
        echo "  linux/amd64"
        echo "  linux/arm64"
        echo

        docker buildx build \
          --builder resilience-builder \
          --platform linux/amd64,linux/arm64 \
          --tag "$IMAGE" \
          --push \
          ./application
      displayName: 'Build and push multi-architecture image'

    # --------------------------------------------------------
    # Verify multi-architecture manifest
    # --------------------------------------------------------

    - script: |
        set -e

        IMAGE="$(acrLoginServer)/$(imageRepository):$(Build.BuildId)"

        echo "Verifying pushed multi-architecture image:"
        echo "$IMAGE"

        docker buildx imagetools inspect "$IMAGE"
      displayName: 'Verify multi-architecture image'

    # --------------------------------------------------------
    # Install Trivy
    # --------------------------------------------------------

    - script: |
        set -e

        echo "Installing Trivy..."

        sudo apt-get update
        sudo apt-get install -y wget

        wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

        echo
        echo "Trivy version:"
        trivy --version
      displayName: 'Install Trivy'

    # --------------------------------------------------------
    # Scan AMD64 and ARM64 images
    # --------------------------------------------------------

    - script: |
        set -e

        IMAGE="$(acrLoginServer)/$(imageRepository):$(Build.BuildId)"

        echo "=========================================="
        echo "Scanning AMD64 image"
        echo "=========================================="

        trivy image \
          --platform linux/amd64 \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          "$IMAGE"

        echo
        echo "=========================================="
        echo "Scanning ARM64 image"
        echo "=========================================="

        trivy image \
          --platform linux/arm64 \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          "$IMAGE"

        echo
        echo "=========================================="
        echo "Trivy security scans passed"
        echo "=========================================="
      displayName: 'Trivy vulnerability scan'

# ============================================================
# Stage 3 - Deploy
# ============================================================

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy resilience-app'
    environment: 'resilience-prod'

    pool:
      vmImage: $(vmImageName)

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy application to AKS'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                echo "Getting AKS credentials..."

                az aks get-credentials \
                  --resource-group "$(aksResourceGroup)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                echo
                echo "Preparing production Kustomize deployment..."

                cd "$(Build.SourcesDirectory)"

                KUSTOMIZATION="kubernetes/overlays/prod/kustomization.yaml"
                BACKUP="/tmp/prod-kustomization.yaml.backup"

                cp "$KUSTOMIZATION" "$BACKUP"

                restore_kustomization() {
                  cp "$BACKUP" "$KUSTOMIZATION"
                }

                trap restore_kustomization EXIT

                echo "Updating production image tag..."

                sed -i \
                  "s/^    newTag: .*/    newTag: \"$(Build.BuildId)\"/" \
                  "$KUSTOMIZATION"

                echo
                echo "Production Kustomization image tag:"
                grep "newTag:" "$KUSTOMIZATION"

                echo
                echo "Rendering production manifests..."

                kubectl kustomize kubernetes/overlays/prod \
                  > /tmp/resilience-prod-rendered.yaml

                echo
                echo "Verifying rendered image..."

                grep -q \
                  "$(acrLoginServer)/$(imageRepository):$(Build.BuildId)" \
                  /tmp/resilience-prod-rendered.yaml

                echo
                echo "Verifying security hardening..."

                grep -q "runAsNonRoot: true" \
                  /tmp/resilience-prod-rendered.yaml

                grep -q "runAsUser: 1000" \
                  /tmp/resilience-prod-rendered.yaml

                grep -q "allowPrivilegeEscalation: false" \
                  /tmp/resilience-prod-rendered.yaml

                echo
                echo "Applying production manifests..."

                kubectl apply \
                  -f /tmp/resilience-prod-rendered.yaml

                echo
                echo "Waiting for rollout..."

                kubectl -n "$(kubernetesNamespace)" rollout status \
                  deployment/resilience-app \
                  --timeout=300s

                echo
                echo "Deployment completed successfully."


# ============================================================
# Stage 4 - Verify
# ============================================================

- stage: Verify
  displayName: 'Verify application health'
  dependsOn: Deploy
  condition: succeeded()

  jobs:
  - job: Verify
    displayName: 'Verify AKS deployment'

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: AzureCLI@2
      displayName: 'Verify AKS application'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "Getting AKS credentials..."

          az aks get-credentials \
            --resource-group "$(aksResourceGroup)" \
            --name "$(aksClusterName)" \
            --overwrite-existing

          echo
          echo "=========================================="
          echo "Pods"
          echo "=========================================="

          kubectl -n "$(kubernetesNamespace)" get pods -o wide

          echo
          echo "=========================================="
          echo "Deployment"
          echo "=========================================="

          kubectl -n "$(kubernetesNamespace)" get deployment resilience-app

          echo
          echo "=========================================="
          echo "Service"
          echo "=========================================="

          kubectl -n "$(kubernetesNamespace)" get service resilience-app

          echo
          echo "=========================================="
          echo "Waiting for ready replicas"
          echo "=========================================="

          kubectl -n "$(kubernetesNamespace)" wait \
            --for=condition=Available \
            deployment/resilience-app \
            --timeout=120s

          echo
          echo "=========================================="
          echo "Starting temporary port-forward"
          echo "=========================================="

          kubectl -n "$(kubernetesNamespace)" \
            port-forward service/resilience-app 18080:80 \
            > /tmp/resilience-port-forward.log 2>&1 &

          PORT_FORWARD_PID=$!

          trap 'kill $PORT_FORWARD_PID 2>/dev/null || true' EXIT

          sleep 5

          echo
          echo "=========================================="
          echo "Testing /health"
          echo "=========================================="

          curl --fail --silent \
            http://127.0.0.1:18080/health

          echo
          echo
          echo "Health check passed."

# ============================================================
# Stage 5 - Terraform Validate and Plan
# ============================================================

- stage: TerraformValidate
  displayName: 'Terraform validate and plan'
  dependsOn: BuildAndScan
  condition: succeeded()

  jobs:
  - job: TerraformValidate
    displayName: 'Validate and plan PROD, DR and GLOBAL'

    pool:
      vmImage: $(vmImageName)

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Terraform fmt, init, validate and plan'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "=========================================="
          echo "Azure authentication"
          echo "=========================================="

          az account show --output table

          TENANT_ID=$(az account show --query tenantId -o tsv)

          if [ -z "$TENANT_ID" ]; then
            echo "ERROR: Azure tenant ID could not be determined."
            exit 1
          fi

          echo "Azure tenant detected successfully."

          echo
          echo "=========================================="
          echo "Installing Terraform 1.16.3"
          echo "=========================================="

          TERRAFORM_VERSION="1.16.3"

          wget -q \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            -O /tmp/terraform.zip

          rm -rf /tmp/terraform-bin
          mkdir -p /tmp/terraform-bin

          unzip -o /tmp/terraform.zip -d /tmp/terraform-bin

          sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform

          terraform version

          echo
          echo "=========================================="
          echo "Terraform PROD"
          echo "=========================================="

          cd "$(Build.SourcesDirectory)/terraform/environments/prod"

          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate

          terraform plan \
            -input=false \
            -var="tenant_id=${TENANT_ID}" \
            -out=/tmp/prod.tfplan

          echo
          echo "PROD Terraform validation and plan passed."

          echo
          echo "=========================================="
          echo "Terraform DR"
          echo "=========================================="

          cd "$(Build.SourcesDirectory)/terraform/environments/dr"

          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate

          terraform plan \
            -input=false \
            -out=/tmp/dr.tfplan

          echo
          echo "DR Terraform validation and plan passed."

          echo
          echo "=========================================="
          echo "Terraform GLOBAL"
          echo "=========================================="

          cd "$(Build.SourcesDirectory)/terraform/environments/global"

          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate

          terraform plan \
            -input=false \
            -out=/tmp/global.tfplan

          echo
          echo "GLOBAL Terraform validation and plan passed."

          echo
          echo "=========================================="
          echo "All Terraform validation and plans passed"
          echo "=========================================="
